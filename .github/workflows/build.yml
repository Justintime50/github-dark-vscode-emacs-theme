name: build

on: [push, pull_request]

jobs:
  sh-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: luizm/action-sh-checker@v0.10.0
        env:
          SHFMT_OPTS: -i 4 -d
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - '25'
          - '26'
          - '27'
          - '28'
          - '29'
          - '30'
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}
      - uses: leotaku/elisp-check@v1.4.1
        with:
          check: melpa
          file: '*.el'
          ignore_warnings: false
          warnings_as_errors: true
